[package]
name = "zcode-update"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "查询并解析 ZCode Electron 更新清单的命令行工具"
authors = ["wang93wei"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
ureq = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
