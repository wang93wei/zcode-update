name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发行版标签（如 v1.2.3）；留空则自动用 v0.0.0-run.<编号> 并标记为预发布'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # aarch64
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: ubuntu-latest       # x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest      # x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --verbose

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../zcode-update-${{ matrix.target }}.tar.gz zcode-update

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/zcode-update.exe `
            -DestinationPath zcode-update-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-update-${{ matrix.target }}
          path: zcode-update-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 标签优先级：在 tag 引用上触发 > 手动输入 > 自动生成（标记预发布）
      - name: Determine release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_TAG}" ]]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-run.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and attach archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
